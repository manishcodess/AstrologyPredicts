<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology Insights</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Astrology Insights</h1>
        <form id="astroForm">
            <!--label for, id -->
            <label for="name">First Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="surname">Surname:</label>
            <input type="text" id="surname" name="surname" required>

            <label for="day">Date of Birth (Day):</label>
            <input type="number" id="day" name="day" min="1" max="31" required>
   <!--he attributes min="1" and max="31" don’t stop you from typing numbers 
   outside that range.   They only affect form validation — meaning the browser
    will show an error only when the form is submitted (or when you explicitly 
    trigger validation).-->
            <label for="month">Month:</label>
            <input type="number" id="month" name="month" min="1" max="12" required>

            <label for="year">Year:</label>
            <input type="number" id="year" name="year" min="1900" max="2023" required>

            <button type="submit" value="Get Insights">Get Insights</button>
                <!--we prefer button over input-->
        </form>
        <div class="result" id="result"></div>
    </div>

    <script src="./first.js"></script>
</body>
</html>
