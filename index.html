<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology Insights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="stars-bg"></div>
    
    <div class="container">
        <h1>Astrology Insights</h1>
        <p class="subtitle">Discover what the universe holds for you</p>
        <form id="astroForm">
            <div class="input-group">
                <label for="name">First Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your first name">
            </div>
            
            <div class="input-group">
                <label for="surname">Surname</label>
                <input type="text" id="surname" name="surname" required placeholder="Enter your surname">
            </div>

            <div class="date-group">
                <div class="input-group">
                    <label for="day">Day</label>
                    <input type="number" id="day" name="day" min="1" max="31" required placeholder="DD">
                </div>
                <div class="input-group">
                    <label for="month">Month</label>
                    <input type="number" id="month" name="month" min="1" max="12" required placeholder="MM">
                </div>
                <div class="input-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" name="year" min="1900" max="2024" required placeholder="YYYY">
                </div>
            </div>

            <button type="submit" value="Get Insight">Reveal Insights</button>
        </form>
        <div class="result" id="result"></div>
    </div>

    <script src="./first.js"></script>
</body>
</html>
